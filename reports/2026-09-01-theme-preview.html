<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme Preview | Poke Insight</title>
  <style>
    :root{--primary:#72c9c5;--secondary:#e58ca0;--accent:#4f8eaf;--surface:#fffdfa;--background:#f4faf9;--text:#213745;--muted:#69808b;--border:#d8e7e5}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--background),#fff4f6);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.7}
    main{width:min(100% - 28px,820px);margin:auto;padding:40px 0 72px}.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:0 14px 36px rgba(49,91,105,.1)}
    a{color:var(--accent)}h1{margin:.2em 0}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.swatch{height:90px;border-radius:16px;display:grid;place-items:end start;padding:10px;color:#fff;font-size:12px;font-weight:700}.p{background:var(--primary)}.s{background:var(--secondary)}.a{background:var(--accent)}
    @media(max-width:560px){.swatches{grid-template-columns:1fr}}
  </style>
</head>
<body><main><a href="../index.html">← Poke Insight</a><article class="card"><div>Theme Preview / 2026-09-01</div><h1>Milotic-inspired Theme</h1><p>テーマ差し替えの確認用ページです。トップページの配色は <code>reports.json</code> の <code>theme.colors</code> から変更できます。</p><div class="swatches"><div class="swatch p">primary</div><div class="swatch s">secondary</div><div class="swatch a">accent</div></div></article></main></body>
</html>
